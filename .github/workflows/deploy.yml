name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * *'  # daily rebuild so the contribution graph stays current
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Fetch GitHub contributions
        run: node scripts/fetch-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || secrets.GITHUB_TOKEN }}

      # sbrouck.org is built by Cloudflare Pages from main, so the refreshed snapshot must be
      # committed there. Pushes made with GITHUB_TOKEN do not re-trigger this workflow.
      - name: Commit refreshed contributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contributions.json
          if git diff --cached --quiet; then
            echo "Contributions unchanged."
          else
            git commit -m "Refresh GitHub contributions snapshot"
            git push origin HEAD:main
          fi

      - name: Build
        run: |
          npm run build
          ls -la dist
          ls -la dist/images
        env:
          VITE_BASE_URL: '/'

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }} 